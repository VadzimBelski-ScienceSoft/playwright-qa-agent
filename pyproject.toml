[project]
name = "playwright-qa-agent"
version = "0.1.0"
description = "Playwright QA Agent - AI-powered test generation and execution"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.39",
    "playwright>=1.58.0",
    "mistune>=3.0",
    "junit-xml>=1.9",
]

[project.scripts]
playwright-qa-agent = "src.cli.main:main"

[tool.uv]
dev-dependencies = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
